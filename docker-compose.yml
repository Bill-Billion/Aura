services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smarthomesim-backend
    env_file:
      - path: ./.env.local
        required: false
      - path: ./.env
        required: false
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./tests:/app/tests

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: smarthomesim-frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - backend
    env_file:
      - path: ./.env.local
        required: false
      - path: ./.env
        required: false
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules

volumes:
  frontend_node_modules:
