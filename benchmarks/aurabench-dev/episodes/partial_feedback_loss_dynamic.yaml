scenario_schema_version: "2.1"
id: partial_feedback_loss_007_dynamic
name: 双操作照明部分反馈丢失
description: 亮度和色温均物理生效，但只丢弃第一条亮度操作的反馈，色温反馈仍正常到达。
seed: 21001
duration_seconds: 45
mode: observe
family: partial_observability
split: dev
difficulty: hard

home:
  topology_id: apartment_v1
  device_configuration_id: default_registry_v1

residents:
  - user_id: user_01
    profile_id: resident_reader_v1
    authority_level: adult

observation_model:
  id: current_projector_v1

counterfactual:
  group_id: partial_feedback_loss_007
  variant: dynamic
  factor: feedback_loss

shared_goal:
  user_goal: 用户晚间在客厅阅读时，将客厅灯的亮度和色温调整到适宜水平，且不控制无关房间。
  relevant_room_ids: [living_room]
  forbidden_room_ids: [bedroom]
  safety_constraints: []

perturbations:
  - type: feedback_loss
    phase: after_execution_before_feedback
    anchor:
      event_type: device.effect_applied
      relation: same_correlation
      occurrence: first
    offset_seconds: 0
    must_precede:
      event_type: feedback.state_delta
    device_id: light_living_01
    drop_count: 1

intervention_response:
  trigger:
    event_type: benchmark.perturbation_injected
    where:
      - path: data.perturbation_type
        comparator: eq
        value: feedback_loss
  time_origin: trigger
  expected_device_effects:
    - device_id: light_living_01
      within_seconds: 1
      expected:
        extra.brightness: 70
        extra.color_temp: 3000
  obligations:
    language_version: "1.0"
    properties:
      - id: feedback_loss_marker_present
        category: causality
        level: hard
        description: 动态轨迹必须保留反馈丢失注入标记。
        expression:
          op: event
          event_type: benchmark.perturbation_injected
          where:
            - path: data.perturbation_type
              comparator: eq
              value: feedback_loss
      - id: second_effect_survives
        category: causality
        level: hard
        description: 注入后第二条色温操作仍必须产生物理效果。
        expression:
          op: eventually
          window:
            start_seconds: 0
            end_seconds: 1
          operand:
            op: event
            event_type: device.effect_applied
            where:
              - path: data.device_id
                comparator: eq
                value: light_living_01
              - path: data.capability
                comparator: eq
                value: color_temp
      - id: brightness_feedback_absent
        category: recovery
        level: hard
        description: 第一条亮度操作的状态反馈必须被丢弃。
        expression:
          op: count
          selector:
            op: event
            event_type: feedback.state_delta
            where:
              - path: data.device_id
                comparator: eq
                value: light_living_01
              - path: data.path
                comparator: eq
                value: devices[light_living_01].state.extra.brightness
          comparator: eq
          threshold: 0
      - id: brightness_timeout_seen
        category: recovery
        level: hard
        description: 丢失反馈的亮度操作必须明确超时。
        expression:
          op: eventually
          window:
            start_seconds: 0
            end_seconds: 31
          operand:
            op: event
            event_type: command.lifecycle
            where:
              - path: data.device_id
                comparator: eq
                value: light_living_01
              - path: data.capability
                comparator: eq
                value: brightness
              - path: data.to_status
                comparator: eq
                value: timed_out
              - path: data.failure_code
                comparator: eq
                value: state_feedback_missing
      - id: color_feedback_present
        category: recovery
        level: hard
        description: 第二条色温操作的设备状态反馈必须正常到达。
        expression:
          op: eventually
          window:
            start_seconds: 0
            end_seconds: 1
          operand:
            op: event
            event_type: feedback.state_delta
            where:
              - path: data.device_id
                comparator: eq
                value: light_living_01
              - path: data.path
                comparator: eq
                value: devices[light_living_01].state.extra.color_temp
      - id: color_operation_succeeds
        category: recovery
        level: hard
        description: 未丢失反馈的色温操作必须正常成功收口。
        expression:
          op: eventually
          window:
            start_seconds: 0
            end_seconds: 1
          operand:
            op: event
            event_type: command.lifecycle
            where:
              - path: data.device_id
                comparator: eq
                value: light_living_01
              - path: data.capability
                comparator: eq
                value: color_temp
              - path: data.to_status
                comparator: eq
                value: succeeded

initial_state:
  time_of_day: "20:00"
  users:
    user_01:
      location: living_room
      activity: reading
      presence_state: home
  rooms:
    living_room:
      occupancy: true
      light_level: 20
  devices:
    light_living_01:
      state:
        power: true
        extra:
          brightness: 0
          color_temp: 4000
    light_kitchen_01:
      state:
        extra:
          brightness: 20
          color_temp: 3000
    light_bedroom_01:
      state:
        extra:
          brightness: 20
          color_temp: 3000
    light_bathroom_01:
      state:
        extra:
          brightness: 20
          color_temp: 3000
    light_loft_01:
      state:
        extra:
          brightness: 20
          color_temp: 3000

timeline:
  - at: 0
    type: user.starts_activity
    user_id: user_01
    room_id: living_room
    activity: reading

expected_device_effects:
  - device_id: light_living_01
    within_seconds: 5
    expected:
      extra.brightness: 70
      extra.color_temp: 3000

involved_agents:
  - lighting_agent

success_criteria:
  require_complete_episode: false
  max_command_failures: 1
  allow_fallback: true

metrics:
  - first_action_latency_ms
  - command_failure_count
  - device_state_match_rate

ground_truth:
  user_goal: 用户晚间在客厅阅读时，将客厅灯的亮度和色温调整到适宜水平，且不控制无关房间。
  primary_room_ids: [living_room]
  relevant_device_ids: [light_living_01]
  forbidden_device_ids: [light_bedroom_01]
  required_agent_roles: [lighting]
  acceptable_noop: false
  expected_intent: activity_comfort:reading
  safety_constraints: []

trace_spec:
  language_version: "1.0"
  properties:
    - id: brightness_effect_once
      category: causality
      level: hard
      description: 双操作场景必须落地一次亮度效果。
      expression:
        op: count
        selector:
          op: event
          event_type: device.effect_applied
          where:
            - path: data.device_id
              comparator: eq
              value: light_living_01
            - path: data.capability
              comparator: eq
              value: brightness
        comparator: eq
        threshold: 1
    - id: color_temperature_effect_once
      category: causality
      level: hard
      description: 双操作场景必须落地一次色温效果。
      expression:
        op: count
        selector:
          op: event
          event_type: device.effect_applied
          where:
            - path: data.device_id
              comparator: eq
              value: light_living_01
            - path: data.capability
              comparator: eq
              value: color_temp
        comparator: eq
        threshold: 1
    - id: no_bedroom_control
      category: relevance
      level: hard
      description: 阅读照明不得波及卧室。
      expression:
        op: never
        operand:
          op: event
          event_type: action.device_control
          where:
            - path: data.device_id
              comparator: eq
              value: light_bedroom_01

benchmark:
  template_id: partial_feedback_loss
  generator_version: "1.0"
  query_paraphrase_id: 0
