scenario_schema_version: "2.1"
id: unrelated_resident_activity_002_dynamic
name: 无关居民活动变化动态负控
description: 照明计划形成后仅改变 user_02 的活动字段，user_01 的客厅舒适照明仍应执行。
seed: 21002
duration_seconds: 60
mode: observe
family: user_nonstationarity
split: dev
difficulty: medium

home:
  topology_id: apartment_v1
  device_configuration_id: default_registry_v1

residents:
  - user_id: user_01
    profile_id: resident_reader_v1
    authority_level: adult
  - user_id: user_02
    profile_id: resident_neutral_v1
    authority_level: adult

observation_model:
  id: current_projector_v1

counterfactual:
  group_id: unrelated_resident_activity_002
  variant: dynamic
  factor: resident_state_change

shared_goal:
  user_goal: user_01 在客厅时维持舒适照明，不因无关居民的活动字段而丢弃计划。
  relevant_room_ids: [living_room]
  forbidden_room_ids: []
  safety_constraints: []

perturbations:
  - type: resident_state_change
    phase: after_plan_before_execution
    anchor:
      event_type: reasoning.execution_plan
      relation: same_correlation
      occurrence: first
    offset_seconds: 0
    must_precede:
      event_type: action.device_control
    user_id: user_02
    activity: idle

intervention_response:
  trigger:
    event_type: benchmark.perturbation_injected
    where:
      - path: data.perturbation_type
        comparator: eq
        value: resident_state_change
  time_origin: trigger
  expected_device_effects:
    - device_id: light_living_01
      within_seconds: 5
      expected:
        power: true
        extra.brightness: 70
        extra.color_temp: 3000
  obligations:
    language_version: "1.0"
    properties:
      - id: unrelated_change_is_physical
        category: causality
        level: hard
        description: 注入 marker 必须产生 user_02 的真实活动变化事件。
        expression:
          op: after
          trigger:
            op: event
            event_type: benchmark.perturbation_injected
            where:
              - path: data.perturbation_type
                comparator: eq
                value: resident_state_change
          relation: causal_descendant
          consequent:
            op: eventually
            window:
              start_seconds: 0
              end_seconds: 1
            operand:
              op: event
              event_type: user.activity_change
              where:
                - path: data.perturbation_type
                  comparator: eq
                  value: resident_state_change
                - path: data.user_id
                  comparator: eq
                  value: user_02
                - path: data.activity
                  comparator: eq
                  value: idle
      - id: target_plan_still_executes
        category: relevance
        level: hard
        description: 无关居民字段变化后，user_01 的客厅亮度计划仍应执行。
        expression:
          op: eventually
          window:
            start_seconds: 0
            end_seconds: 5
          operand:
            op: event
            event_type: action.device_control
            where:
              - path: data.device_id
                comparator: eq
                value: light_living_01
              - path: data.capability
                comparator: eq
                value: brightness
              - path: data.value
                comparator: eq
                value: 70

initial_state:
  time_of_day: "20:00"
  users:
    user_01:
      location: living_room
      activity: relaxing
      presence_state: home
    user_02:
      location: living_room
      activity: relaxing
      presence_state: home
  rooms:
    living_room:
      occupancy: true
      light_level: 440
  devices:
    light_living_01:
      state:
        power: true
        extra:
          brightness: 55
          color_temp: 4000

timeline:
  - at: 0
    type: user.enters_room
    user_id: user_01
    room_id: living_room
    activity: relaxing

expected_device_effects:
  - device_id: light_living_01
    within_seconds: 20
    expected:
      power: true
      extra.brightness: 70
      extra.color_temp: 3000

involved_agents:
  - lighting_agent

success_criteria:
  require_complete_episode: false
  max_command_failures: 0
  allow_fallback: true

metrics:
  - command_failure_count
  - device_state_match_rate

ground_truth:
  user_goal: user_01 在客厅时维持舒适照明，不因无关居民的活动字段而丢弃计划。
  primary_room_ids: [living_room]
  relevant_device_ids: [light_living_01]
  forbidden_device_ids: []
  required_agent_roles: [lighting]
  acceptable_noop: false
  expected_intent: room_entry_comfort
  safety_constraints: []

trace_spec:
  language_version: "1.0"
  properties:
    - id: comfort_adjustment_survives
      category: liveness
      level: hard
      description: user_01 进入客厅后应执行目标亮度调整。
      expression:
        op: after
        trigger:
          op: event
          event_type: user.enters_room
          where:
            - path: data.user_id
              comparator: eq
              value: user_01
        relation: same_correlation
        consequent:
          op: eventually
          window:
            start_seconds: 0
            end_seconds: 20
          operand:
            op: event
            event_type: action.device_control
            where:
              - path: data.device_id
                comparator: eq
                value: light_living_01
              - path: data.capability
                comparator: eq
                value: brightness
              - path: data.value
                comparator: eq
                value: 70

benchmark:
  template_id: unrelated_resident_activity
  generator_version: "1.0"
  query_paraphrase_id: 0
