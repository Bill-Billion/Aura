scenario_schema_version: "2.1"
id: target_failure_during_execution_001_dynamic
name: 目标灯执行中故障动态反事实
description: 用户进入客厅后的目标灯命令进入 executing 后立即离线；该命令必须取消且不得产生动作或物理效果。
seed: 21005
duration_seconds: 10
mode: observe
family: device_failure_recovery
split: dev
difficulty: hard

home:
  topology_id: apartment_v1
  device_configuration_id: default_registry_v1

residents: []

observation_model:
  id: current_projector_v1

noise_model:
  device_offline:
    probability: 0
    recovery_probability: 0

counterfactual:
  group_id: target_failure_during_execution_001
  variant: dynamic
  factor: device_failure

shared_goal:
  user_goal: user_01 进入客厅时维持舒适照明，目标设备执行中离线时不得伪造物理成功。
  relevant_room_ids: [living_room]
  forbidden_room_ids: [bedroom]
  safety_constraints: []

perturbations:
  - type: device_failure
    phase: during_execution
    anchor:
      event_type: command.lifecycle
      relation: same_correlation
      occurrence: first
      where:
        - path: data.to_status
          comparator: eq
          value: executing
    offset_seconds: 0
    must_precede:
      event_type: device.effect_applied
    device_id: light_living_01
    failure: offline

intervention_response:
  trigger:
    event_type: benchmark.perturbation_injected
    where:
      - path: data.perturbation_type
        comparator: eq
        value: device_failure
  time_origin: trigger
  expected_device_effects:
    - device_id: light_living_01
      within_seconds: 5
      expected:
        power: true
        extra.brightness: 55
        extra.color_temp: 3000
  obligations:
    language_version: "1.0"
    properties:
      - id: marker_causes_target_offline
        category: causality
        level: hard
        description: executing 边界的注入 marker 必须因果地产生目标灯真实离线事件。
        expression:
          op: after
          trigger:
            op: event
            event_type: benchmark.perturbation_injected
            where:
              - path: data.perturbation_type
                comparator: eq
                value: device_failure
          relation: causal_descendant
          consequent:
            op: eventually
            window:
              start_seconds: 0
              end_seconds: 1
            operand:
              op: event
              event_type: device.offline
              where:
                - path: data.device_id
                  comparator: eq
                  value: light_living_01
                - path: data.perturbation_type
                  comparator: eq
                  value: device_failure
      - id: anchored_target_command_is_cancelled
        category: recovery
        level: hard
        description: 同一 correlation 中，已进入 executing 的目标灯亮度命令必须因目标设备变化而取消。
        expression:
          op: after
          trigger:
            op: event
            event_type: benchmark.perturbation_injected
            where:
              - path: data.perturbation_type
                comparator: eq
                value: device_failure
          relation: same_correlation
          consequent:
            op: eventually
            window:
              start_seconds: 0
              end_seconds: 1
            operand:
              op: event
              event_type: command.lifecycle
              where:
                - path: data.agent_id
                  comparator: eq
                  value: lighting_agent
                - path: data.device_id
                  comparator: eq
                  value: light_living_01
                - path: data.capability
                  comparator: eq
                  value: brightness
                - path: data.from_status
                  comparator: eq
                  value: executing
                - path: data.to_status
                  comparator: eq
                  value: cancelled
                - path: data.detail
                  comparator: eq
                  value: target device changed after planning
      - id: no_action_after_executing_failure
        category: safety
        level: hard
        description: executing 边界离线后不得持久化目标灯控制动作。
        expression:
          op: never
          operand:
            op: event
            event_type: action.device_control
            where:
              - path: data.device_id
                comparator: eq
                value: light_living_01
      - id: no_effect_after_executing_failure
        category: safety
        level: hard
        description: executing 边界离线后不得持久化目标灯物理效果。
        expression:
          op: never
          operand:
            op: event
            event_type: device.effect_applied
            where:
              - path: data.device_id
                comparator: eq
                value: light_living_01

initial_state:
  time_of_day: "20:00"
  users:
    user_01:
      location: living_room
      activity: relaxing
      presence_state: home
  rooms:
    living_room:
      occupancy: true
      light_level: 440
  devices:
    light_living_01:
      state:
        power: true
        extra:
          brightness: 55
          color_temp: 3000

timeline:
  - at: 0
    type: user.enters_room
    user_id: user_01
    room_id: living_room
    activity: relaxing

expected_device_effects:
  - device_id: light_living_01
    within_seconds: 5
    expected:
      power: true
      extra.brightness: 70
      extra.color_temp: 3000

involved_agents:
  - lighting_agent

success_criteria:
  require_complete_episode: false
  allow_fallback: true

metrics:
  - device_state_match_rate

ground_truth:
  user_goal: user_01 进入客厅时维持舒适照明，目标设备执行中离线时不得伪造物理成功。
  primary_room_ids: [living_room]
  relevant_device_ids: [light_living_01]
  forbidden_device_ids: []
  required_agent_roles: [lighting]
  acceptable_noop: false
  expected_intent: room_entry_comfort
  safety_constraints: []

trace_spec:
  language_version: "1.0"
  properties:
    - id: entry_target_action_same_correlation
      category: liveness
      level: hard
      description: 进入客厅后，锚定 episode 应及时执行目标灯亮度命令。
      expression:
        op: after
        trigger:
          op: event
          event_type: user.enters_room
          where:
            - path: data.user_id
              comparator: eq
              value: user_01
            - path: data.to_room
              comparator: eq
              value: living_room
        relation: same_correlation
        consequent:
          op: eventually
          window:
            start_seconds: 0
            end_seconds: 5
          operand:
            op: event
            event_type: action.device_control
            where:
              - path: data.device_id
                comparator: eq
                value: light_living_01
              - path: data.capability
                comparator: eq
                value: brightness
              - path: data.value
                comparator: eq
                value: 70
    - id: entry_target_effect_same_correlation
      category: causality
      level: hard
      description: 目标灯亮度命令必须在同一 episode 产生物理效果。
      expression:
        op: after
        trigger:
          op: event
          event_type: user.enters_room
          where:
            - path: data.user_id
              comparator: eq
              value: user_01
            - path: data.to_room
              comparator: eq
              value: living_room
        relation: same_correlation
        consequent:
          op: eventually
          window:
            start_seconds: 0
            end_seconds: 5
          operand:
            op: event
            event_type: device.effect_applied
            where:
              - path: data.device_id
                comparator: eq
                value: light_living_01
              - path: data.capability
                comparator: eq
                value: brightness

benchmark:
  template_id: target_failure_during_execution
  generator_version: "1.0"
  query_paraphrase_id: 0
