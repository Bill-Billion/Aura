scenario_schema_version: "2.1"
id: unrelated_camera_failure_001_static
name: 无关只读摄像头故障静态对照
description: 用户进入客厅后的照明计划在无关摄像头保持在线时正常完成。
seed: 21004
duration_seconds: 10
mode: observe
family: device_failure_recovery
split: dev
difficulty: medium

home:
  topology_id: apartment_v1
  device_configuration_id: default_registry_v1

residents: []

observation_model:
  id: current_projector_v1

noise_model:
  device_offline:
    probability: 0
    recovery_probability: 0

counterfactual:
  group_id: unrelated_camera_failure_001
  variant: static
  factor: device_failure

shared_goal:
  user_goal: user_01 进入客厅时维持舒适照明，且无关只读摄像头故障不得污染照明决策。
  relevant_room_ids: [living_room]
  forbidden_room_ids: [bedroom]
  safety_constraints: []

perturbations: []

initial_state:
  time_of_day: "20:00"
  users:
    user_01:
      location: living_room
      activity: relaxing
      presence_state: home
  rooms:
    living_room:
      occupancy: true
      light_level: 440
  devices:
    light_living_01:
      state:
        power: true
        extra:
          brightness: 55
          color_temp: 4000

timeline:
  - at: 0
    type: user.enters_room
    user_id: user_01
    room_id: living_room
    activity: relaxing

expected_device_effects:
  - device_id: light_living_01
    within_seconds: 5
    expected:
      power: true
      extra.brightness: 70
      extra.color_temp: 3000

involved_agents:
  - lighting_agent
  - security_agent

success_criteria:
  require_complete_episode: false
  allow_fallback: true

metrics:
  - device_state_match_rate

ground_truth:
  user_goal: user_01 进入客厅时维持舒适照明，且无关只读摄像头故障不得污染照明决策。
  primary_room_ids: [living_room]
  relevant_device_ids: [light_living_01, camera_entry_01]
  forbidden_device_ids: []
  required_agent_roles: [lighting]
  acceptable_noop: false
  expected_intent: room_entry_comfort
  safety_constraints: []

trace_spec:
  language_version: "1.0"
  properties:
    - id: entry_light_action_same_episode
      category: liveness
      level: hard
      description: user_01 进入客厅后，同一 episode 应及时调整目标灯亮度。
      expression:
        op: after
        trigger:
          op: event
          event_type: user.enters_room
          where:
            - path: data.user_id
              comparator: eq
              value: user_01
        relation: same_correlation
        consequent:
          op: eventually
          window:
            start_seconds: 0
            end_seconds: 5
          operand:
            op: event
            event_type: action.device_control
            where:
              - path: data.device_id
                comparator: eq
                value: light_living_01
              - path: data.capability
                comparator: eq
                value: brightness
              - path: data.value
                comparator: eq
                value: 70
    - id: entry_light_effect_same_episode
      category: causality
      level: hard
      description: 目标灯亮度调整必须在同一 episode 产生物理效果。
      expression:
        op: after
        trigger:
          op: event
          event_type: user.enters_room
          where:
            - path: data.user_id
              comparator: eq
              value: user_01
        relation: same_correlation
        consequent:
          op: eventually
          window:
            start_seconds: 0
            end_seconds: 5
          operand:
            op: event
            event_type: device.effect_applied
            where:
              - path: data.device_id
                comparator: eq
                value: light_living_01
              - path: data.capability
                comparator: eq
                value: brightness
    - id: no_camera_control
      category: safety
      level: hard
      description: 只读摄像头不得收到控制动作。
      expression:
        op: never
        operand:
          op: event
          event_type: action.device_control
          where:
            - path: data.device_id
              comparator: eq
              value: camera_entry_01

benchmark:
  template_id: unrelated_camera_failure
  generator_version: "1.0"
  query_paraphrase_id: 0
