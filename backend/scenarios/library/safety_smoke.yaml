# §13「Safety event interrupts comfort or energy-saving behavior」—— 库里第一个 safety 档场景。
#
# 为什么这个文件存在：S3 结束时 §9.1 的**最高档没有任何运行期生产者**。SecurityAgent
# 早就会把 ``safety.smoke_detected`` 兜成 SAFETY 档（backend/agents/security.py），
# 可是整个场景库没有一条 timeline 发得出这条根事件，于是全序仲裁只在下半截被走过：
# S3 复审实测九个库场景的提案档位只有 comfort/security/energy/ambience/explicit_user，
# safety 恒为 0。一个"从来没出场过"的最高档，等于把"安全优先"留在文档里。
#
# 场景形状刻意做成**打断**而不是单纯的报警：用户在厨房做饭（comfort 档照明已经就位），
# 人离开后照明域按"空房间"把厨房调暗，烟雾报警随后在同一间房触发，安防域以 safety 档
# 要求疏散照明全开。于是同一条 episode 的 coordination_decision 里 safety 与 comfort 落在
# **同一个控制点**（light_kitchen_01 的 brightness），§9.2 的 same_device_property 分类器
# 必须选边，而且必须选安全那边——这正是 S4 要的"安全打断舒适行为"的真实素材
# （断言见 tests/test_security_agent.py::test_smoke_scenario_preempts_a_comfort_tier_behaviour）。
scenario_schema_version: "1.0"
id: safety_smoke_kitchen
name: 做饭时厨房烟雾报警
description: 用户在厨房做饭、舒适照明已就位时厨房检测到烟雾，期望安防域以最高档打断舒适照明并全开疏散照明。
seed: 1009
duration_seconds: 90
mode: observe

initial_state:
  time_of_day: "18:40"
  weather: clear
  outdoor_temp: 21.0
  outdoor_humidity: 0.55
  users:
    user_01:
      location: kitchen
      activity: cooking
      presence_state: home
  rooms:
    kitchen:
      occupancy: true
      # 低于默认光照阈值（120 lux）：做饭一开始就有一轮真实的舒适照明行为，
      # "被打断的那件事"因此不是假设出来的。
      light_level: 95
      temperature: 27.0
    living_room:
      occupancy: false
      light_level: 130
      temperature: 25.0
  devices:
    light_kitchen_01:
      state:
        power: true
        extra:
          brightness: 55
    light_living_01:
      state:
        power: true
        extra:
          brightness: 70
    # 空房间里还开着的空调：给 §13「energy-saving behavior」留的场景底色。
    # 说清楚边界——本场景**没有**能耗域根事件，EnergyAgent 因此不开 episode，
    # 被安全事件按住的那件事是照明域的舒适/回落行为（实测 per_agent 只有
    # lighting/hvac/security 三家）。别把这台空调读成"energy 档也有生产者了"。
    ac_living_01:
      state:
        power: true

timeline:
  - at: 0
    type: user.starts_activity
    user_id: user_01
    room_id: kitchen
    activity: cooking
  # 人离开厨房（锅还在灶上）：空房间触发省电/舒适回落，厨房照明被调暗——
  # 这就是随后要被安全事件打断的那件"正在进行的行为"。
  - at: 20
    type: user.exits_room
    user_id: user_01
    room_id: kitchen
  - at: 30
    type: user.enters_room
    user_id: user_01
    room_id: living_room
  - at: 40
    type: safety.smoke_detected
    room_id: kitchen
    payload:
      smoke_level: 0.62
      significant_change_reasons: ["safety_smoke_detected"]
  # 烟雾未散，传感器再报一次。这一条不是凑数：疏散照明把空厨房点到 100 之后，
  # 照明域的"空房间回落"规则下一轮就想把它调回 20——两个提案落在同一个控制点，
  # §9.2 的 same_device_property 必须选边，而且必须选 safety 那边。
  # 库里的 safety 档因此不只是"出现过"，而是**在同一条决策里赢过 comfort 档**。
  - at: 50
    type: safety.smoke_detected
    room_id: kitchen
    payload:
      smoke_level: 0.71
      significant_change_reasons: ["safety_smoke_detected"]

expected_device_effects:
  # 疏散照明：全开且拉满（SecurityAgent.EVACUATION_BRIGHTNESS = 100）。
  # 第一条报警在 at=40 落地，留一拍（默认 10 模拟秒/拍）的执行余量。
  - device_id: light_kitchen_01
    within_seconds: 60
    expected:
      power: true
      extra.brightness:
        min: 100

involved_agents:
  - security_agent
  - lighting_agent

success_criteria:
  require_complete_episode: true
  max_first_action_latency_ms: 3000
  max_command_failures: 0
  allow_fallback: true

metrics:
  - first_action_latency_ms
  - command_failure_count
  - user_intent_satisfied
  - device_state_match_rate

ground_truth:
  user_goal: "厨房烟雾报警时立刻给出疏散照明，安全压过照明域按钟点/空房间算出来的舒适档亮度"
  primary_room_ids: ["kitchen"]
  relevant_device_ids:
    - light_kitchen_01
    # §7 safety.smoke_detected 行的 secondary_device_types 含 sensor：空气传感器是这条
    # 事件的观测来源，S4 判"相关设备"时它算相关，但它不是可写落点。
    - sensor_utility_air_01
  # 疏散响应应当收在着火房间：把全屋灯当成"顺手也调一下"的对象是 §6.5 同款的
  # user_intent_satisfied 的安全约束失分点。
  forbidden_device_ids:
    - light_bedroom_01
    - light_loft_01
  required_agent_roles: ["security"]
  acceptable_noop: false
  expected_intent: "safety_smoke_response"
  safety_constraints:
    - "evacuation_lighting_must_not_be_dimmed_by_comfort_or_energy_rules"
    - "never_disable_cameras_during_a_safety_event"
