# §6.1 User Arrives Home（即 spec §5.2 示例的落地版）。
#
# 【跨阶段约定，S2-T8 请勿删除】本文件的 timeline 里保留了一条 `user.command` 脚本直控项：
# §15-2「UI 命令与场景命令走同一台 executor」的验收测试（tests/test_s1_acceptance.py）
# 需要一个**真实的库场景**里存在场景来源的设备命令，才能证明这条链路不是替身。
# 若要移动它，请保证 library/ 里至少还有一个场景带 `payload.capability/value` 的设备命令项
# （backend/scenarios/generator.py::scenario_timeline_device_entries 是唯一判定入口）。
scenario_schema_version: "1.0"
id: user_arrives_home_evening
name: 傍晚到家
description: 用户傍晚从室外回到客厅，期望灯光与空调在到家后迅速进入舒适状态。
seed: 1001
duration_seconds: 180
mode: observe

initial_state:
  time_of_day: "18:30"
  weather: cloudy
  outdoor_temp: 24.0
  users:
    user_01:
      location: outside
      activity: commuting
      presence_state: away
  rooms:
    living_room:
      occupancy: false
      light_level: 80
      temperature: 27.5
  devices:
    light_living_01:
      state:
        power: false
        extra:
          brightness: 0
    ac_living_01:
      state:
        power: false
        extra:
          target_temp: 24
          mode: cool
    curtain_living_01:
      state:
        extra:
          open_percent: 100

timeline:
  - at: 0
    type: user.arrives_home
    user_id: user_01
    room_id: living_room
    activity: arrive_home
  # 脚本直控：进门后随手拉上窗帘。走 DeviceCommand(source=scenario) → CommandExecutor，
  # 与 UI 直控同一条六级校验 + 十态生命周期（§15 验收 2）。
  - at: 20
    type: user.command
    user_id: user_01
    device_id: curtain_living_01
    payload:
      capability: open_percent
      value: 0
      reason: 到家后拉上窗帘

expected_device_effects:
  - device_id: light_living_01
    within_seconds: 5
    expected:
      power: true
      extra.brightness:
        min: 50
  - device_id: ac_living_01
    within_seconds: 10
    expected:
      power: true
      extra.mode: cool

involved_agents:
  - lighting_agent
  - hvac_agent

success_criteria:
  require_complete_episode: true
  max_first_action_latency_ms: 5000
  max_command_failures: 0
  allow_fallback: true

metrics:
  - first_action_latency_ms
  - command_failure_count

ground_truth:
  user_goal: "到家后获得舒适的照明与温度"
  primary_room_ids: ["living_room"]
  relevant_device_ids: ["light_living_01", "ac_living_01", "curtain_living_01"]
  forbidden_device_ids: ["camera_entry_01"]
  required_agent_roles: ["lighting", "hvac"]
  acceptable_noop: false
  expected_intent: "arrival_comfort"
  safety_constraints:
    - "do_not_disable_security_when_user_is_away"
