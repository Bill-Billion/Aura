# §6.3 Night Sleep —— 用户从客厅移动到卧室并开始睡眠。
#
# 根事件是 `user.starts_activity` + `activity=sleeping`（§6.3 原文）。前两条 timeline 项
# 是必要的铺垫而非装饰：不先把人搬进卧室，"睡眠"就发生在一个空房间里，光照/温度的相关性
# 判定全部失真。
scenario_schema_version: "1.0"
id: night_sleep_bedtime
name: 夜间入睡
description: 用户深夜从客厅进入卧室入睡，非卧室照明熄灭、卧室窗帘闭合、温度进入睡眠区间。
seed: 1003
duration_seconds: 120
mode: observe

initial_state:
  time_of_day: "22:50"
  weather: clear
  outdoor_temp: 19.0
  outdoor_humidity: 0.6
  users:
    user_01:
      location: living_room
      activity: relaxing
      presence_state: home
  rooms:
    living_room:
      occupancy: true
      light_level: 220
      temperature: 24.0
    bedroom:
      occupancy: false
      light_level: 150
      temperature: 25.5
  devices:
    light_living_01:
      state:
        power: true
        extra:
          brightness: 75
    light_bedroom_01:
      state:
        power: true
        extra:
          brightness: 70
          color_temp: 3500
    curtain_bedroom_01:
      state:
        extra:
          open_percent: 100
    curtain_bedroom_02:
      state:
        extra:
          open_percent: 100
    ac_bedroom_01:
      state:
        power: false
        extra:
          target_temp: 23
          mode: cool

timeline:
  - at: 0
    type: user.exits_room
    user_id: user_01
    room_id: living_room
  - at: 10
    type: user.enters_room
    user_id: user_01
    room_id: bedroom
  - at: 40
    type: user.starts_activity
    user_id: user_01
    room_id: bedroom
    activity: sleeping

expected_device_effects:
  - device_id: light_living_01
    within_seconds: 20
    expected:
      power: false
  - device_id: light_bedroom_01
    within_seconds: 20
    expected:
      power: false
  - device_id: curtain_bedroom_01
    within_seconds: 20
    expected:
      extra.open_percent: 0
  - device_id: ac_bedroom_01
    within_seconds: 30
    expected:
      power: true
      extra.target_temp:
        min: 22
        max: 26

involved_agents:
  - lighting_agent
  - hvac_agent

success_criteria:
  require_complete_episode: true
  max_first_action_latency_ms: 6000
  max_command_failures: 0
  allow_fallback: true

metrics:
  - first_action_latency_ms
  - command_failure_count
  - user_intent_satisfied
  - device_state_match_rate

ground_truth:
  user_goal: "进入睡眠状态：卧室暗下来、温度舒适、安防照常工作"
  primary_room_ids: ["bedroom"]
  relevant_device_ids:
    - light_bedroom_01
    - light_living_01
    - curtain_bedroom_01
    - curtain_bedroom_02
    - ac_bedroom_01
  # §6.3 "keep security devices active without disturbing sleep"：摄像头不许为"安静"被关。
  forbidden_device_ids: ["camera_bedroom_02"]
  required_agent_roles: ["lighting", "hvac"]
  acceptable_noop: false
  # backend/agents/orchestrator.py::_ACTIVITY_RULE_TABLE[(user.starts_activity, sleeping)]。
  expected_intent: "sleep_comfort"
  safety_constraints:
    - "keep_security_devices_enabled_while_sleeping"
    - "no_bright_light_in_bedroom_after_sleep_start"
