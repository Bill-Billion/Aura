# §6.5 Cooking —— 用户进厨房做饭。
#
# 这是八个场景里唯一一个"正确答案包含大量不动作"的：§6.5 明确 "avoid unnecessary
# whole-home changes"，摄像头 "not normally relevant"。因此本场景的判定重心不在
# expected_device_effects（只有厨房灯一条），而在 forbidden_device_ids ——
# S4 的 user_intent_satisfied 会把这份“不得波及无关房间”约束纳入安全判定。
scenario_schema_version: "1.0"
id: cooking_dinner
name: 傍晚做饭
description: 用户傍晚从客厅进入厨房开始做饭，厨房照明提升，其余房间不受打扰。
seed: 1005
duration_seconds: 120
mode: observe

initial_state:
  time_of_day: "18:05"
  weather: cloudy
  outdoor_temp: 22.0
  outdoor_humidity: 0.6
  users:
    user_01:
      location: living_room
      activity: relaxing
      presence_state: home
  rooms:
    living_room:
      occupancy: true
      light_level: 200
      temperature: 25.0
    kitchen:
      occupancy: false
      # 低于默认光照阈值（120 lux）：人一进厨房，rule_based 源就会补一条
      # environment.light_level_threshold —— 脚本事件与规则事件在同一场景里同时可见。
      light_level: 90
      temperature: 26.5
  devices:
    light_kitchen_01:
      state:
        power: false
        extra:
          brightness: 55
    light_living_01:
      state:
        power: true
        extra:
          brightness: 70

timeline:
  - at: 0
    type: user.exits_room
    user_id: user_01
    room_id: living_room
  - at: 10
    type: user.enters_room
    user_id: user_01
    room_id: kitchen
  - at: 20
    type: user.starts_activity
    user_id: user_01
    room_id: kitchen
    activity: cooking
  - at: 100
    type: user.ends_activity
    user_id: user_01
    room_id: kitchen
    activity: cooking

expected_device_effects:
  - device_id: light_kitchen_01
    within_seconds: 15
    expected:
      power: true
      extra.brightness:
        min: 60

involved_agents:
  - lighting_agent

success_criteria:
  require_complete_episode: true
  max_first_action_latency_ms: 5000
  max_command_failures: 0
  allow_fallback: true

metrics:
  - first_action_latency_ms
  - command_failure_count
  - user_intent_satisfied
  - device_state_match_rate

ground_truth:
  user_goal: "做饭期间厨房光照充足，且不惊动其他房间"
  primary_room_ids: ["kitchen"]
  relevant_device_ids:
    - light_kitchen_01
    - sensor_utility_air_01
  # §6.5 "camera is not normally relevant" + "avoid unnecessary whole-home changes"
  forbidden_device_ids:
    - camera_entry_01
    - camera_living_02
    - light_bedroom_01
  required_agent_roles: ["lighting"]
  acceptable_noop: false
  expected_intent: "cooking_task_lighting"
  safety_constraints:
    - "do_not_change_unrelated_rooms_while_cooking"
