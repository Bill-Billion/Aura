name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # 兜底：即使 pytest 本身卡死（install/collect 阶段），也不占满 GitHub 默认 6h 上限
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      # tests/ imports `backend.*`, so pytest must run from the repo root
      # --timeout: WS 用例走阻塞式 ws.receive_json()，少发一条消息会挂死而不是失败，
      # 必须由 pytest-timeout 把"挂起"转成"失败"，否则 CI 会一直跑到 job 上限
      - run: pytest tests/ --timeout=120

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # vue-tsc -b && vite build
      - run: npm run build
      # node --test over the ts unit suites (strip-types)
      - run: npm run test --if-present
